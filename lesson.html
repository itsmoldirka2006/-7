<!DOCTYPE html>
<html>
<head>
    <title>JavaScript тапсырмалары</title>
</head>
<body>

    <script>
 let number = Number(prompt("введи числло:"));
 if (number > 0)
 {
 alert("число положительное");

 }
 else if (number < 0)
 {
 alert("число отрицательное");
 }
 else {
 alert("это ноль");
 }
 </script>

</body>
</html>
